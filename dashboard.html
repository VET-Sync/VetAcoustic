<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f5ef"><title>Dashboard · VetAcoustics</title><script src="https://cdn.tailwindcss.com"></script><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/static/css/app.css"></head>
<body><div class="app-shell">
  <header class="topbar"><a class="brand" href="/dashboard"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h3l2-5 4 11 2-6h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>VetAcoustics<small>Clinical sound notes</small></span></a><div class="top-actions"><span class="top-label">Clinic workspace</span><button class="logout-button" id="logout-button" type="button">Sign out</button></div></header>
  <main class="page-wrap">
    <div class="page-heading"><div><p class="eyebrow">Your clinic, at a glance</p><h1>Good day, Doctor.</h1><p class="subheading">A clear record of each listen, each patient, and what comes next.</p></div><a class="button" href="/new-visit"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>New visit</a></div>
    <section class="stats-grid" aria-label="Visit summary">
      <article class="card stat-card"><span class="stat-label">Visits recorded</span><strong class="stat-value" id="stat-visits">—</strong><span class="stat-foot">Across your clinic</span></article>
      <article class="card stat-card"><span class="stat-label">Patients seen</span><strong class="stat-value" id="stat-patients">—</strong><span class="stat-foot">Unique patient records</span></article>
      <article class="card stat-card"><span class="stat-label">Recent activity</span><strong class="stat-value" id="stat-recent">—</strong><span class="stat-foot">Latest visit on file</span></article>
    </section>
    <section class="card" aria-labelledby="recent-title"><div class="list-header"><h2 id="recent-title">Recent visits</h2><label class="search-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input type="search" id="visit-search" aria-label="Search by patient name or case ID" placeholder="Find a patient or case ID"></label></div>
      <div id="load-error" class="notice notice-error hidden" role="alert" style="margin:16px"></div>
      <ul class="visit-list" id="visit-list" aria-live="polite"></ul>
    </section>
  </main>
  <form id="logout-form" class="hidden"></form>
</div><script src="/static/js/common.js" defer></script><script src="/static/js/dashboard.js" defer></script></body></html>
